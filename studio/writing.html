<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="studio-token" content="__STUDIO_TOKEN__"><meta name="robots" content="noindex,nofollow"><title>图文与个人资料 · Rolin Studio</title><link rel="stylesheet" href="/writing.css"></head>
<body>
<header><a href="/">ROLIN <small>STUDIO</small></a><nav aria-label="内容管理"><a href="/">作品</a><a href="/writing">图文</a><a href="/profile">个人资料</a></nav><button id="preview">预览网站 ↗</button></header>
<div class="workspace">
<aside id="article-sidebar"><div class="list-heading"><h1>图文</h1><button id="new" title="新增文章" aria-label="新增文章">+</button></div><input id="search" type="search" placeholder="搜索文章" aria-label="搜索文章"><div id="article-list"></div></aside>
<main>
<p class="privacy">内容默认保存在本机。上传到公开 GitHub 后，草稿与个人资料也会出现在仓库源码中，请勿填写私密信息。</p>
<section id="article-editor"><div class="actions"><h2 id="editor-title">图文</h2><span id="save-state"></span><button id="delete" class="danger">删除文章</button><button id="save" class="primary">保存到本地</button></div>
<p id="empty">还没有文章。</p>
<form id="article-form" hidden>
<label>标题<input name="title" maxlength="120" required></label><div class="two-columns"><label>展示状态<select name="status"><option value="Draft">草稿 · 网站不展示</option><option value="Published">网站展示 · 上传网站后上线</option></select></label><label>日期<input name="date" type="date"></label></div>
<label>摘要<textarea name="summary" rows="3" maxlength="600"></textarea></label>
<div class="cover-row"><img id="cover" alt="文章封面" hidden><label class="file-label">选择封面<input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="remove-cover">移除封面</button></div>
<div class="body-heading"><h3>正文</h3><button type="button" id="read-preview">阅读预览</button></div>
<div id="blocks"></div><div class="block-tools"><button type="button" data-add="paragraph">+ 段落</button><button type="button" data-add="heading">+ 标题</button><button type="button" data-add="quote">+ 引用</button><label class="file-label">+ 图片<input id="body-image" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
</form></section>
<section id="profile-editor" hidden><div class="actions"><h2>个人资料</h2><button id="save-profile" class="primary">保存到本地</button></div>
<form id="profile-form"><label>显示名称<input name="name" maxlength="120" placeholder="Rolin"></label><label>个人介绍<textarea name="bio" rows="4" maxlength="1000"></textarea></label><label>联系邮箱<input name="email" type="email" maxlength="120"></label><div class="two-columns"><label>小红书账号 / 名称<input name="xiaohongshu" maxlength="120"></label><label>小红书主页链接<input name="xiaohongshuUrl" type="url" placeholder="https://…"></label><label>抖音账号 / 名称<input name="douyin" maxlength="120"></label><label>抖音主页链接<input name="douyinUrl" type="url" placeholder="https://…"></label></div><label>微信号<input name="wechat" maxlength="120"></label><div class="cover-row"><img id="qr" alt="微信二维码" hidden><label class="file-label">上传微信二维码<input id="qr-file" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="remove-qr">移除二维码</button></div></form>
</section>
<p class="publish-note">保存不会上传。确认预览后，回到「作品」页点击「上传网站」。未填写的联系方式不会展示。</p>
</main></div><div id="notice" role="status" aria-live="polite" hidden></div>
<dialog id="reading"><button id="close-reading" aria-label="关闭阅读预览" title="关闭">×</button><article id="reading-body"></article></dialog>
<script src="/writing.js" defer></script></body></html>
